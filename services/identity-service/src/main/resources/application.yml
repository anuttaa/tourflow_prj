server:
  port: 8081
spring:
  main:
    allow-bean-definition-overriding: true
  application.name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity_pw}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
management.endpoints.web.exposure.include: health,info
app:
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
  frontend-url: ${FRONTEND_URL:https://localhost}
  jwt:
    key-file: ${JWT_KEY_FILE:./jwt-key.json}
    access-ttl-min: 15
    refresh-ttl-days: 7
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager123!}
    client-password: ${SEED_CLIENT_PASSWORD:Client123!}
