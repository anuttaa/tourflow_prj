server:
  port: 8083
spring:
  main:
    allow-bean-definition-overriding: true
  application.name: planning-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planning_db}
    username: ${DB_USER:planning}
    password: ${DB_PASSWORD:planning_pw}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: planning
      auto-offset-reset: earliest
    listener.missing-topics-fatal: false
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management.endpoints.web.exposure.include: health,info
resilience4j.circuitbreaker.instances.catalog:
  slidingWindowSize: 10
  minimumNumberOfCalls: 5
  failureRateThreshold: 50
  waitDurationInOpenState: 10s
  ignoreExceptions:
    - org.springframework.web.client.HttpClientErrorException
app:
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
  public-paths: /api/v1/public/**
  catalog-url: ${CATALOG_URL:http://localhost:8082}
  identity-url: ${IDENTITY_URL:http://localhost:8081}
  pricing.margin: ${PRICING_MARGIN:0.15}
