server:
  port: 8082
spring:
  main:
    allow-bean-definition-overriding: true
  application.name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog_pw}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
management.endpoints.web.exposure.include: health,info
app:
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}
  public-paths: /nonexistent
  seed-enabled: ${SEED_ENABLED:true}
