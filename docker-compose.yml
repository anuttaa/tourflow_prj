# Запуск: cp .env.example .env && docker compose up -d --build
name: tourflow

x-java-service: &java-service
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?задайте IDENTITY_DB_PASSWORD в .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?задайте CATALOG_DB_PASSWORD в .env}
      PLANNING_DB_PASSWORD: ${PLANNING_DB_PASSWORD:?задайте PLANNING_DB_PASSWORD в .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?задайте BOOKING_DB_PASSWORD в .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?задайте NOTIFICATION_DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [backend]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports: ["8025:8025"]
    networks: [backend]

  identity:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: identity-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?задайте INTERNAL_TOKEN в .env}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8443}
      JWT_KEY_FILE: /data/jwt-key.json
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-Manager123!}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-Client123!}
    volumes:
      - jwtkeys:/data

  catalog:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: catalog-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USER: catalog
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      SEED_ENABLED: ${SEED_ENABLED:-true}

  planning:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: planning-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/planning_db
      DB_USER: planning
      DB_PASSWORD: ${PLANNING_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      CATALOG_URL: http://catalog:8082
      IDENTITY_URL: http://identity:8081

  booking:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: booking-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USER: booking
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      CATALOG_URL: http://catalog:8082
      PLANNING_URL: http://planning:8083

  notification:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: notification-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025

  gateway:
    <<: *java-service
    build: { context: ., dockerfile: deploy/Dockerfile.service, args: { MODULE: gateway } }
    depends_on: [identity, catalog, planning, booking]
    environment:
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      IDENTITY_URL: http://identity:8081
      CATALOG_URL: http://catalog:8082
      PLANNING_URL: http://planning:8083
      BOOKING_URL: http://booking:8084
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443}

  frontend:
    build: { context: ., dockerfile: deploy/Dockerfile.frontend }
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "8443:443"
      - "8088:80"
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  kafkadata:
  jwtkeys:
